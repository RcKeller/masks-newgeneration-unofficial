name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release zip
        run: |
          MODULE_ID=$(node -p "require('./package.json').name")
          mkdir -p "${MODULE_ID}"
          cp -r dist/* "${MODULE_ID}/"
          # Include non-dist assets that should be in the release
          [ -d "packs" ] && cp -r packs "${MODULE_ID}/" || true
          [ -d "images" ] && cp -r images "${MODULE_ID}/" || true
          zip -r release.zip "${MODULE_ID}/"
          rm -rf "${MODULE_ID}"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
